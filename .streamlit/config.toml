[theme]
primaryColor = "#6366f1"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#0f172a"
font = "sans serif"
baseRadius = "0.5rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#6366f1"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#0f172a"
borderColor = "#e2e8f0"

[theme.dark]
primaryColor = "#818cf8"
backgroundColor = "#0b0f19"
secondaryBackgroundColor = "#111827"
textColor = "#f8fafc"
borderColor = "#1f2937"

[server]
headless = true
enableCORS = false
